    .card {
      background: var(--card);

      gap: 12px;

      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .category {

      background: #334155;
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);

      min-height: 110px;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.86rem;
      resize: vertical;
    }
    .actions {

      gap: 10px;
      align-items: center;

      font-weight: 600;
      font-size: 0.82rem;

    const defaultSent = {};
    leads.forEach(l => defaultSent[l.id] = 'sent');
    const savedStatus = Object.assign({}, defaultSent, JSON.parse(localStorage.getItem('exe_leads_status_v2') || '{}'));

    function updateCounter() {
      const sentCount = Object.values(savedStatus).filter(s => s !== 'pending' && s !== undefined).length;
      document.getElementById('counter').textContent = `Contactados: ${sentCount} / ${leads.length}`;
    }

    function render() {
      const container = document.getElementById('cards-container');
      const query = (document.getElementById('search').value || '').toLowerCase();
      container.innerHTML = '';

      leads
        .filter(l =>
          l.name.toLowerCase().includes(query) ||
          l.category.toLowerCase().includes(query) ||
          l.address.toLowerCase().includes(query) ||
          l.phoneDisplay.toLowerCase().includes(query)
        )
        .forEach(lead => {
          const status = savedStatus[lead.id] || 'sent';
          const card = document.createElement('div');
          card.className = `card ${status === 'replied' ? 'replied' : (status !== 'pending' ? 'sent' : '')}`;
          card.id = `card-${lead.id}`;

          const waBtn = lead.wa
            ? `<button class="btn btn-wa" onclick="sendWA(${lead.id}, '${lead.wa}')">💬 Abrir WhatsApp (${lead.phoneDisplay})</button>`
            : '';

          const mailBtn = lead.email
            ? `<button class="btn btn-mail" onclick="sendGmail(${lead.id}, '${lead.email}', '${(lead.subject || 'Consulta vecino Florida Oeste').replace(/'/g, "\\'")}')">✉️ Abrir Gmail (${lead.email})</button>`
            : '';

          card.innerHTML = `
            <div class="card-header">
              <h3 class="title">${lead.id}. ${lead.name}</h3>
              <span class="category">${lead.category}</span>
            </div>
            <div class="meta">📍 ${lead.address}</div>
            <textarea id="msg-${lead.id}">${lead.msg}</textarea>
            <div class="actions">
              ${waBtn}
              ${mailBtn}
              <select class="status-select" onchange="changeStatus(${lead.id}, this.value)">
                <option value="pending" ${status === 'pending' ? 'selected' : ''}>⏳ Pendiente</option>
                <option value="sent" ${status === 'sent' ? 'selected' : ''}>✅ Enviado</option>
                <option value="replied" ${status === 'replied' ? 'selected' : ''}>🔥 Respondió</option>
                <option value="visit" ${status === 'visit' ? 'selected' : ''}>🚶 Pasar en persona</option>
              </select>
            </div>
          `;
          container.appendChild(card);
        });
      updateCounter();
    }

    function sendWA(id, phone) {
      const text = document.getElementById(`msg-${id}`).value;
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    function sendGmail(id, email, subject) {
      const body = document.getElementById(`msg-${id}`).value;
      const url = `https://mail.google.com/mail/?view=cm&fs=1&tf=1&to=${encodeURIComponent(email)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.open(url, '_blank');
    }

    function changeStatus(id, value) {
      savedStatus[id] = value;
      localStorage.setItem('exe_leads_status_v2', JSON.stringify(savedStatus));
      render();
    }

    render();
  </script>
